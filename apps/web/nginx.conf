server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA fallback — every route is served by the React router.
  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
  }
}

# Development overrides — applied automatically by `docker compose up`.
# Hot reload for both the API (uvicorn --reload) and the web app (vite dev server).
services:
  api:
    build:
      target: dev
    command: ["/app/entrypoint.sh", "--reload"]
    volumes:
      - ./apps/api:/app
      - uploads:/data/uploads

  web:
    build:
      target: dev
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"

volumes:
  web_node_modules:
